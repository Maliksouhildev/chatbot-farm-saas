<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salem Labs — Gestion de la Performance</title>
  <meta name="description" content="Système de gestion de la performance des Laboratoires Salem">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <!-- AUTH OVERLAY -->
  <div id="auth-overlay" class="auth-overlay">
    <div class="auth-bg-orb auth-bg-orb-1"></div>
    <div class="auth-bg-orb auth-bg-orb-2"></div>
    <div class="auth-bg-orb auth-bg-orb-3"></div>
    <div id="auth-container" class="auth-container"></div>
  </div>

  <!-- MAIN APP -->
  <div id="app" class="app hidden">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand-wrapper">
          <div class="sidebar-logo-icon"><i class="fas fa-flask"></i></div>
          <div class="sidebar-brand-text">
            <h2 class="brand-title">Salem Labs</h2>
            <span class="brand-sub">Performance Hub</span>
          </div>
        </div>
        <button class="sidebar-collapse-btn" id="sidebar-collapse-btn">
          <i class="fas fa-chevron-left"></i>
        </button>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-user" id="sidebar-user"></div>
        <button class="logout-btn" id="logout-btn">
          <i class="fas fa-sign-out-alt"></i><span>Déconnexion</span>
        </button>
      </div>
    </aside>

    <main class="main-content" id="main-content">
      <header class="topbar" id="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" id="mobile-menu-btn"><i class="fas fa-bars"></i></button>
          <div class="breadcrumb" id="breadcrumb">
            <span><i class="fas fa-home"></i></span>
            <span class="breadcrumb-sep"><i class="fas fa-chevron-right"></i></span>
            <span id="page-title-text">Tableau de bord</span>
          </div>
        </div>
        <div class="topbar-center">
          <div class="topbar-search">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Rechercher..." id="global-search">
          </div>
        </div>
        <div class="topbar-right">
          <button class="topbar-btn notif-btn" id="notif-btn">
            <i class="fas fa-bell"></i>
            <span class="badge" id="notif-badge" style="display:none">0</span>
          </button>
          <button class="topbar-btn" id="msg-topbar-btn">
            <i class="fas fa-envelope"></i>
            <span class="badge msg-badge" id="msg-badge" style="display:none">0</span>
          </button>
          <div class="topbar-avatar-wrapper" id="topbar-avatar-wrapper">
            <div class="topbar-avatar" id="topbar-avatar"></div>
            <div class="avatar-menu hidden" id="avatar-menu">
              <div class="avatar-menu-header" id="avatar-menu-header"></div>
              <div class="avatar-menu-divider"></div>
              <a class="avatar-menu-item" data-route="admin" id="goto-admin"><i class="fas fa-cog"></i> Administration</a>
              <div class="avatar-menu-divider"></div>
              <a class="avatar-menu-item danger" id="avatar-logout"><i class="fas fa-sign-out-alt"></i> Déconnexion</a>
            </div>
          </div>
        </div>
      </header>

      <div class="notif-panel hidden" id="notif-panel">
        <div class="notif-panel-header">
          <h3><i class="fas fa-bell"></i> Notifications</h3>
          <button class="btn-text" id="mark-all-read">Tout marquer lu</button>
        </div>
        <div class="notif-list" id="notif-list"></div>
      </div>

      <div class="page-content" id="page-content"></div>
    </main>
  </div>

  <!-- MODAL -->
  <div class="modal-backdrop hidden" id="modal-backdrop">
    <div class="modal" id="modal">
      <div class="modal-header" id="modal-header">
        <h3 id="modal-title"></h3>
        <button class="modal-close-btn" id="modal-close-btn"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <!-- TOAST CONTAINER -->
  <div class="toast-container" id="toast-container"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/employees.js"></script>
  <script src="js/goals.js"></script>
  <script src="js/evaluations.js"></script>
  <script src="js/pdp.js"></script>
  <script src="js/messaging.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/admin.js"></script>
  <script>document.addEventListener('DOMContentLoaded', () => Salem.app.init());</script>
</body>
</html>
