services:
  # ====================================================================
  # 1. EVOLUTION API v2 (WhatsApp & Omnichannel Gateway)
  # ====================================================================
  evolution-api:
    image: evoapicloud/evolution-api:v2.1.2
    container_name: evolution_gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - DOCKER_ENV=true
      - LOG_LEVEL=ERROR,WARN,INFO
      - LOG_BAILEYS=debug
      - CONFIG_SESSION_PHONE_CLIENT=Evolution API
      - CONFIG_SESSION_PHONE_NAME=Chrome
      - CONFIG_SESSION_PHONE_VERSION=2.3000.1043857760
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-farm_evolution_master_secret_2026}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:${POSTGRES_PASSWORD:-farm_postgres_secret_123}@postgres:5432/evolution
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-farm_postgres_secret_123}@postgres:5432/evolution
      - DATABASE_CLIENT_NAME=evolution_db
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_CHATS=true
      - DATABASE_SAVE_DATA_MESSAGES=true
      - REDIS_ENABLED=true
      - REDIS_URI=redis://redis:6379
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=http://host.docker.internal:5678/webhook/universal-omnichannel-router
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=false
    command: ["npm", "run", "start:prod"]
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - postgres
      - redis

  # ====================================================================
  # 2. REDIS (Session Cache & High-Speed Queue)
  # ====================================================================
  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  # ====================================================================
  # 3. POSTGRESQL (Evolution API Session & Message Database)
  # ====================================================================
  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-farm_postgres_secret_123}
      - POSTGRES_DB=evolution
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  evolution_instances:
  redis_data:
  postgres_data:
