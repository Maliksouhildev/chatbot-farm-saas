# =============================================================================
# Lead Engine Docker Compose
# Production-ready, self-hosted B2B Lead Gen & Omnichannel Outreach Stack
# Engineered for Windows 11 (16GB RAM Host) with strict memory & CPU caps
# =============================================================================

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL 16: Central Relational Store for Leads & Outreach Logs
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: leadengine_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-lead_engine}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${HOST_POSTGRES_PORT:-5434}:5432"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lead_engine}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lead_net

  # ---------------------------------------------------------------------------
  # 2. Redis 7: SHA-256 Fingerprint Deduplication & Sliding Rate Limiter
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: leadengine_redis
    restart: unless-stopped
    command: >
      redis-server 
      --appendonly yes 
      --maxmemory 192mb 
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${HOST_REDIS_PORT:-6381}:6379"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - lead_net

  # ---------------------------------------------------------------------------
  # 3. Harvesters: Python Microservice (FastAPI + APScheduler + Telethon + PRAW)
  # ---------------------------------------------------------------------------
  harvesters:
    build:
      context: ./harvesters
      dockerfile: Dockerfile
    container_name: leadengine_harvesters
    restart: unless-stopped
    shm_size: 1gb
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-lead_engine}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
      REDDIT_USER_AGENT: ${REDDIT_USER_AGENT:-python:lead-engine-b2b:v1.0}
      REDDIT_USERNAME: ${REDDIT_USERNAME:-}
      REDDIT_PASSWORD: ${REDDIT_PASSWORD:-}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_PHONE: ${TELEGRAM_PHONE:-}
      TELEGRAM_TARGET_GROUPS: ${TELEGRAM_TARGET_GROUPS:-algeria_ecommerce,dz_freelancers,n8n_community}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/lead-ingestion
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./harvesters:/app
      - ./harvesters/session:/app/session
    ports:
      - "${HOST_HARVESTERS_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.5'
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - lead_net

  # ---------------------------------------------------------------------------
  # 4. n8n: Workflow Orchestration Engine (Scoring, HITL, Dispatch)
  # ---------------------------------------------------------------------------
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: leadengine_n8n
    restart: unless-stopped
    ports:
      - "${HOST_N8N_PORT:-5679}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-lead_engine}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-postgres}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: Africa/Algiers
      N8N_PAYLOAD_SIZE_MAX: 16
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      GOOGLE_SHEETS_SPREADSHEET_ID: ${GOOGLE_SHEETS_SPREADSHEET_ID:-}
      GOOGLE_SHEETS_TAB_NAME: ${GOOGLE_SHEETS_TAB_NAME:-Master Leads}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://localhost:8080}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-lead_dispatch}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n_workflows:/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1.5'
        reservations:
          memory: 384M
    networks:
      - lead_net

# -----------------------------------------------------------------------------
# NETWORKS & VOLUMES
# -----------------------------------------------------------------------------
networks:
  lead_net:
    driver: bridge

volumes:
  pgdata:
    name: leadengine_pgdata
  redis_data:
    name: leadengine_redisdata
  n8n_data:
    name: leadengine_n8ndata
